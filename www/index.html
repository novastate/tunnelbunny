<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tunnel Bunny</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0d0f13; --panel:#151920; --panel2:#11151b; --line:#232a34;
  --ink:#e8ebef; --dim:#8a93a2; --faint:#5d6674;
  --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --accent:#5eead4;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
body{background-image:
  radial-gradient(60rem 30rem at 12% -12%, #16333055 0%, transparent 60%),
  radial-gradient(50rem 26rem at 95% 0%, #1a253d55 0%, transparent 55%);
  background-repeat:no-repeat}
.wrap{max-width:960px;margin:0 auto;padding:2.4rem 1.25rem 4rem}

/* ---------- header ---------- */
.head{display:flex;align-items:center;gap:.9rem;margin-bottom:.35rem}
.logo{width:44px;height:44px;flex:none}
.logo svg{width:100%;height:100%;display:block;overflow:visible}
.logo .body{fill:var(--ink);transition:fill .3s}
.logo .eye{fill:var(--bg)}
.running .logo .body{fill:var(--accent)}
.running .logo{animation:hop .62s cubic-bezier(.3,.7,.4,1) infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}
  35%{transform:translateY(-5px) rotate(-6deg)}70%{transform:translateY(0) rotate(2deg)}}
.logo .dash{stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;opacity:0}
.running .logo .dash{animation:dash .62s linear infinite}
.running .logo .dash:nth-of-type(2){animation-delay:.14s}
.running .logo .dash:nth-of-type(3){animation-delay:.28s}
@keyframes dash{0%{opacity:0;transform:translateX(6px)}
  40%{opacity:.9}100%{opacity:0;transform:translateX(-14px)}}
h1{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:.92rem;margin:0 0 1.2rem;max-width:62ch}

/* ---------- provider chip ---------- */
.prov{display:inline-flex;align-items:center;gap:.5rem;font-size:.83rem;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:.34rem .5rem .34rem .9rem;color:var(--dim);margin-bottom:.5rem;flex-wrap:wrap}
.prov b{color:var(--ink);font-weight:600}
.prov.unset{border-color:#4a3f22;background:#20190f;color:var(--warn)}
.prov button{font:inherit;font-size:.78rem;font-weight:600;padding:.18rem .6rem;
  border-radius:999px;background:#1d232c;border:1px solid #2f3846;color:var(--dim);cursor:pointer}
.prov button:hover{background:#252d38;color:var(--ink)}
.prov select,.prov input{font:inherit;font-size:.82rem;background:var(--panel2);color:var(--ink);
  border:1px solid #2f3846;border-radius:8px;padding:.22rem .5rem}
.prov input{width:14rem}
.prov select:focus,.prov input:focus{outline:none;border-color:var(--accent)}
.hint{color:var(--faint);font-size:.79rem;margin:.1rem 0 1.1rem;max-width:66ch;line-height:1.5}
.hint b{color:var(--dim);font-weight:600}
.suggest{margin:.1rem 0 1.1rem}
.suggest button{font:inherit;font-size:.82rem;font-weight:600;padding:.4rem .8rem;
  border-radius:9px;background:#123026;border:1px solid #2c6b52;color:#8ff0c4;cursor:pointer}
.suggest button:hover{background:#17402f}

/* ---------- buttons ---------- */
.row{display:flex;flex-wrap:wrap;gap:.55rem;margin:1.15rem 0 1.6rem}
.btn{font:inherit;font-weight:600;padding:.66rem 1.2rem;border:1px solid var(--line);
  border-radius:11px;background:var(--panel);color:var(--ink);cursor:pointer;
  transition:background .14s,border-color .14s,transform .08s,opacity .14s}
.btn:hover:not(:disabled){background:#1c222b;border-color:#313a48}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#1f6b4f,#17563f);border-color:#2b8a66;
  box-shadow:0 1px 0 #3fae82 inset}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#248059,#1a6349)}
.btn:disabled{opacity:.4;cursor:default}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:.9rem}
.card{position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:15px;padding:1.05rem 1.1rem 1.15rem;overflow:hidden;
  transition:border-color .35s,box-shadow .35s}
.card::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(115deg,transparent 35%,#5eead41f 50%,transparent 65%);
  transform:translateX(-100%)}
.card.run::after{opacity:1;animation:sweep 1.5s ease-in-out infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.card.run{border-color:#2a4a4a}
.card.ok{border-color:#276b48;box-shadow:0 0 0 1px #276b4833}
.card.bad{border-color:#7a3030;box-shadow:0 0 0 1px #7a303033}
.card h2{margin:0;font-size:.76rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:.5rem}
.led{width:7px;height:7px;border-radius:50%;background:#39414e;flex:none}
.card.run .led{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.card.ok  .led{background:var(--ok);box-shadow:0 0 8px #4ade8080}
.card.bad .led{background:var(--bad);box-shadow:0 0 8px #f8717180}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.big{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin:.55rem 0 .1rem;
  font-variant-numeric:tabular-nums}
.big small{font-size:.8rem;font-weight:600;color:var(--dim);margin-left:.28rem}
.meta{color:var(--dim);font-size:.83rem;line-height:1.5;word-break:break-word}
.meta .k{color:var(--faint)}
.verdict{margin-top:.7rem;font-size:.85rem;font-weight:600;display:flex;gap:.4rem;align-items:flex-start}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.unk{color:var(--warn)}
.idle{color:var(--faint);font-size:.86rem;margin-top:.5rem}
.rowin{animation:rowin .32s cubic-bezier(.2,.7,.3,1) both}
@keyframes rowin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.gauge{height:4px;border-radius:4px;background:#1b2129;margin:.45rem 0 .1rem;overflow:hidden}
.gauge i{display:block;height:100%;width:0;border-radius:4px;
  background:linear-gradient(90deg,#2b8a66,#5eead4);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.dnsline{display:flex;gap:.5rem;font-size:.79rem;padding:.16rem 0;border-bottom:1px solid #1b212a}
.dnsline:last-child{border:0}
.dnsline .ip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.dnsline .as{color:var(--faint);white-space:nowrap}
.dnsline.bad .ip{color:var(--bad)}

/* ---------- raw output ---------- */
details{margin-top:1.5rem;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
summary{cursor:pointer;padding:.7rem 1rem;color:var(--dim);font-size:.85rem;font-weight:600;
  list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸ ';color:var(--faint)}
details[open] summary::before{content:'▾ '}
pre{margin:0;padding:0 1rem 1rem;overflow-x:auto;white-space:pre;
  font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#b9c1cc}
.foot{color:var(--faint);font-size:.79rem;margin-top:1rem;min-height:1.2em}
</style>

<div class="wrap" id="wrap">
  <div class="head">
    <div class="logo">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <g class="body">
          <ellipse cx="26" cy="33" rx="13" ry="9.5"/>
          <circle cx="15" cy="26" r="7.2"/>
          <path d="M13 20.5c-1.6-4.6-1.2-8.9.6-9.5 1.8-.6 4 2.6 5 7.2z"/>
          <path d="M18.5 19.4c-.4-4.8.8-8.8 2.7-8.9 1.9-.1 3.2 3.6 3.2 8.4z"/>
          <circle cx="11.5" cy="25" r="1.5" class="eye"/>
          <path d="M38 30c2.6-1.2 4.6-.6 4.4.7-.2 1.3-2.3 2.2-4.6 1.9z"/>
        </g>
        <line class="dash" x1="6" y1="30" x2="0" y2="30"/>
        <line class="dash" x1="8" y1="35" x2="1" y2="35"/>
        <line class="dash" x1="7" y1="40" x2="2" y2="40"/>
      </svg>
    </div>
    <h1>Tunnel&nbsp;Bunny</h1>
  </div>
  <p class="sub">VPN, DNS leaks and speed — measured from here, on the network this container sits on.</p>

  <div class="prov" id="prov"><span style="color:var(--faint)">reading configuration…</span></div>
  <div class="hint" id="hint"></div>
  <div class="suggest" id="suggest"></div>

  <div class="row">
    <button class="btn primary" data-w="all">Run all</button>
    <button class="btn" data-w="vpn">VPN</button>
    <button class="btn" data-w="dns">DNS</button>
    <button class="btn" data-w="speed">Speed</button>
  </div>

  <div class="cards">
    <div class="card" id="c-vpn">
      <h2><span class="led"></span>VPN</h2>
      <div class="content"><div class="idle">Not measured.</div></div>
    </div>
    <div class="card" id="c-dns">
      <h2><span class="led"></span>DNS leak</h2>
      <div class="content"><div class="idle">Not measured.</div></div>
    </div>
    <div class="card" id="c-speed">
      <h2><span class="led"></span>Speed</h2>
      <div class="content"><div class="idle">Not measured.</div></div>
    </div>
  </div>

  <details id="rawbox" hidden>
    <summary>Raw output from <code>check</code></summary>
    <pre id="raw"></pre>
  </details>
  <div class="foot" id="foot"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const wrap = $('wrap'), prov = $('prov'), hint = $('hint'), suggest = $('suggest'),
      raw = $('raw'), rawbox = $('rawbox'), foot = $('foot');
const btns = [...document.querySelectorAll('.btn')];
const card = k => $('c-' + k);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// Several providers have more than one org name in the ASN registry, hence the
// alternations. Mullvad AS39351 is "31173 Services AB"; NordVPN is both Tefincom
// and PacketHub. A single brand name would report a false leak.
const PROVIDERS = [
  ['OVPN','Obehosting|OVPN'], ['Mullvad','31173 Services|Mullvad'],
  ['Proton VPN','Proton'], ['NordVPN','Tefincom|PacketHub|NordVPN'],
  ['Surfshark','Surfshark'], ['ExpressVPN','Express ?VPN'],
  ['Private Internet Access','Private Internet Access|London Trust|PIA'],
  ['IVPN','IVPN'], ['AirVPN','AirVPN'], ['Windscribe','Windscribe'],
  ['CyberGhost','CyberGhost'], ['Njalla','Njalla'],
];

/* ---------- provider ---------- */
let current = '';
function showProvider(p){
  current = p;
  const known = PROVIDERS.find(x => x[1] === p);
  prov.className = p ? 'prov' : 'prov unset';
  prov.innerHTML = p
    ? `VPN provider: <b>${esc(known ? known[0] : p)}</b> <button id="edit">change</button>`
    : `No VPN provider set — no verdict given <button id="edit">set</button>`;
  hint.textContent = '';
  $('edit').onclick = editProvider;
}
function editProvider(){
  prov.className = 'prov';
  const known = PROVIDERS.find(x => x[1] === current);
  const opts = PROVIDERS.map(([n,v]) =>
    `<option value="${esc(v)}"${v===current?' selected':''}>${esc(n)}</option>`).join('');
  prov.innerHTML =
    `<select id="sel"><option value="">— choose provider —</option>${opts}` +
    `<option value="__custom"${current && !known ? ' selected':''}>Other (custom pattern)…</option></select>` +
    `<input id="inp" maxlength="64" placeholder="e.g. Obehosting|OVPN" value="${esc(current)}" ` +
    `style="display:${current && !known ? 'inline-block':'none'}">` +
    `<button id="save">Save</button><button id="cancel">Cancel</button>`;
  const sel = $('sel'), inp = $('inp');
  hint.innerHTML = 'Matched against the ASN/org field on the <b>belongs to</b> line. Several providers '
    + 'have more than one company name — Mullvad\u2019s network is <b>31173 Services AB</b>, '
    + 'NordVPN appears as both <b>Tefincom</b> and <b>PacketHub</b> — so these are patterns, '
    + 'not names. Run the VPN check with nothing set and it will offer what it actually sees.';
  sel.onchange = () => {
    if (sel.value === '__custom'){ inp.style.display='inline-block'; inp.focus(); }
    else { inp.style.display='none'; inp.value = sel.value; }
  };
  $('cancel').onclick = () => showProvider(current);
  $('save').onclick = () => save();
  inp.onkeydown = e => { if (e.key==='Enter') save(); if (e.key==='Escape') showProvider(current); };
}
async function save(v){
  if (typeof v !== 'string'){
    const sel = $('sel'), inp = $('inp');
    v = (sel && sel.value && sel.value !== '__custom') ? sel.value : (inp ? inp.value : '');
  }
  v = v.trim();
  prov.innerHTML = '<span style="color:var(--faint)">saving…</span>';
  try{
    const b = btoa(unescape(encodeURIComponent(v)));   // base64: no URL decoding needed in the shell
    const t = (await (await fetch('/cgi-bin/run?what=setprov&v='+encodeURIComponent(b),
                                  {cache:'no-store'})).text()).trim();
    if (t === 'invalid characters' || t === 'could not save'){
      showProvider(current); hint.textContent = 'Could not save: ' + t + '.';
    } else showProvider(t);
  }catch(e){ showProvider(current); hint.textContent = 'Error: ' + e.message; }
}

/* ---------- card rendering ---------- */
function setCard(k, cls, html){
  const c = card(k);
  c.className = 'card' + (cls ? ' ' + cls : '');
  c.querySelector('.content').innerHTML = html;
}
const vLine = (cls, txt) => `<div class="verdict ${cls} rowin">${esc(txt)}</div>`;

function renderVpn(t){
  const ip  = (t.match(/^\s*exit IP\s+(.+)$/m)||[])[1] || '';
  const org = (t.match(/^\s*belongs to\s+(.+)$/m)||[])[1] || '';
  const split = /SPLIT ROUTING/.test(t);
  const ok  = /^\s*OK /m.test(t), bad = !split && /^\s*!! /m.test(t);

  // Split routing has no single answer, so show both paths rather than a verdict.
  if (split){
    const paths = [...t.matchAll(/^\s+(\S+?)\s*->\s*(\S+)\s+(.*)$/gm)];
    setCard('vpn','bad', `
      <div class="big rowin" style="font-size:1.05rem">Split routing</div>
      <div style="margin-top:.45rem">${paths.map((m,i)=>
        `<div class="dnsline rowin" style="animation-delay:${i*60}ms">
           <span class="ip">${esc(m[1])}</span>
           <span class="as">${esc(m[2])} · ${esc(m[3])}</span></div>`).join('')}</div>
      ${vLine('bad','Only some traffic is tunnelled — no single verdict fits.')}`);
    return;
  }

  setCard('vpn', ok?'ok':bad?'bad':'', `
    <div class="big rowin">${esc(ip||'—')}</div>
    <div class="meta rowin"><span class="k">belongs to</span> ${esc(org||'unknown')}</div>
    ${ok  ? vLine('ok','Exit belongs to your VPN provider.') : ''}
    ${bad ? vLine('bad','Exit does NOT belong to your VPN provider.') : ''}
    ${!ok&&!bad ? vLine('unk','No provider set — no verdict given.') : ''}`);
}

function renderDns(t){
  const rows = [...t.matchAll(/^\s*(!!|)\s*((?:\d{1,3}\.){3}\d{1,3}|[0-9a-f:]{6,})\s{2,}(.+?)\s*$/gmi)];
  const split = /SPLIT ROUTING/.test(t);
  const ok = !split && /^\s*OK /m.test(t), bad = /^\s*!! \d+ of/m.test(t);
  const n  = rows.length;
  const list = rows.map((m,i)=>
    `<div class="dnsline ${m[1]?'bad':''} rowin" style="animation-delay:${i*45}ms">
       <span class="ip">${esc(m[2])}</span><span class="as">${esc(m[3])}</span></div>`).join('');
  setCard('dns', ok?'ok':bad?'bad':'', `
    <div class="big rowin">${n}<small>resolver${n===1?'':'s'}</small></div>
    <div style="margin-top:.35rem">${list || '<div class="idle">none seen</div>'}</div>
    ${ok  ? vLine('ok','All belong to your VPN provider.') : ''}
    ${bad ? vLine('bad',(t.match(/!! (\d+ of \d+[^\n]*)/)||[,'DNS is leaking'])[1]) : ''}
    ${split ? vLine('bad','Split routing — this covers bash.ws only, not the network.') : ''}
    ${!ok&&!bad&&!split ? vLine('unk','No provider set — no verdict given.') : ''}`);
}

function renderSpeed(t){
  const g = re => { const m = t.match(re); return m ? parseFloat(m[1]) : null; };
  const dn = g(/Download:\s*([\d.]+)\s*Mbps/i) ?? g(/Download:\s*([\d.]+)\s*Mbps/i);
  const up = g(/Upload:\s*([\d.]+)\s*Mbps/i)   ?? g(/Upload:\s*([\d.]+)\s*Mbps/i);
  const ls = g(/Packet Loss:\s*([\d.]+)/i);
  if (dn === null && up === null){ setCard('speed','bad',
    `<div class="idle">${esc(t.replace(/^== .* ==\s*/,'').trim()||'measurement failed')}</div>`);
    return; }
  const peak = Math.max(dn||0, up||0, 1);
  setCard('speed','ok', `
    <div class="big rowin"><span id="n-dn">0</span><small>Mbps down</small></div>
    <div class="gauge"><i id="g-dn"></i></div>
    <div class="big rowin" style="margin-top:.6rem"><span id="n-up">0</span><small>Mbps up</small></div>
    <div class="gauge"><i id="g-up"></i></div>
    ${ls !== null ? `<div class="meta rowin" style="margin-top:.6rem">
        <span class="k">packet loss</span> ${ls}%</div>` : ''}`);
  countTo($('n-dn'), dn||0); countTo($('n-up'), up||0);
  requestAnimationFrame(()=>{
    $('g-dn').style.width = ((dn||0)/peak*100)+'%';
    $('g-up').style.width = ((up||0)/peak*100)+'%';
  });
}

// Counts the number up - makes the measurement feel like it lands.
function countTo(el, target){
  const dur = 900, t0 = performance.now();
  (function step(now){
    const p = Math.min(1, (now-t0)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = (target*e).toFixed(target<100?1:0);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

/* ---------- running ---------- */
function offerDetected(text){
  suggest.innerHTML = '';
  const m = text.match(/^\s*belongs to\s+(.+)$/m);
  if (!m) return;
  const org = m[1].trim().replace(/^AS\d+\s+/,'');
  if (!org || org === 'unknown') return;
  let already = false;
  try { already = current && new RegExp(current,'i').test(m[1]); } catch {}
  if (already) return;
  const b = document.createElement('button');
  b.textContent = `Use \u201c${org}\u201d as VPN provider`;
  b.onclick = () => { suggest.innerHTML=''; save(org); };
  suggest.appendChild(b);
}

const RENDER = {vpn:renderVpn, dns:renderDns, speed:renderSpeed};
let busy = false, rawAll = '';

async function one(k){
  setCard(k, 'run', '<div class="idle">measuring…</div>');
  const r = await fetch('/cgi-bin/run?what='+k, {cache:'no-store'});
  const t = (await r.text()).replace(/\s+$/,'');
  rawAll += (rawAll ? '\n\n' : '') + t;
  raw.textContent = rawAll; rawbox.hidden = false;
  try { RENDER[k](t); } catch(e){ setCard(k,'', `<pre style="padding:0">${esc(t)}</pre>`); }
  if (k === 'vpn') offerDetected(t);
}

async function run(w){
  if (busy) return;
  busy = true; rawAll = '';
  btns.forEach(b => b.disabled = true);
  wrap.classList.add('running');
  const list = (w === 'all') ? ['vpn','dns','speed'] : [w];
  list.forEach(k => setCard(k,'','<div class="idle">queued…</div>'));
  const t0 = Date.now();
  const tick = setInterval(()=>{ foot.textContent = ((Date.now()-t0)/1000).toFixed(0)+' s'; }, 250);
  try {
    for (const k of list) await one(k);          // one at a time: the cards fill in sequence
  } catch(e){ foot.textContent = 'Error: ' + e.message; }
  clearInterval(tick);
  wrap.classList.remove('running');
  foot.textContent = 'Done in ' + ((Date.now()-t0)/1000).toFixed(1) + ' s.';
  btns.forEach(b => b.disabled = false);
  busy = false;
}

btns.forEach(b => b.addEventListener('click', () => run(b.dataset.w)));
(async () => {
  try { showProvider((await (await fetch('/cgi-bin/run?what=info',{cache:'no-store'})).text()).trim()); }
  catch { prov.innerHTML = '<span style="color:var(--faint)">could not read configuration</span>'; }
})();
</script>
</html>
