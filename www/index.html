<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tunnel Bunny</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080a0e; --surface:#0f131a; --sunk:#0b0e13; --line:#1b222c; --line2:#252e3a;
  --ink:#e9edf3; --dim:#8590a0; --faint:#59636f;
  --ok:#3ddc97; --bad:#ff6b6b; --warn:#f0b429; --accent:#4fd8c4; --accent2:#5aa9ff;
  --arc:#212b37;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:2.2rem 1.25rem 4rem}

/* ---------- header ---------- */
.head{display:flex;align-items:center;gap:.8rem}
.logo{width:38px;height:38px;flex:none}
.logo svg{width:100%;height:100%;display:block;overflow:visible}
.logo .body{fill:var(--ink);transition:fill .3s}
.logo .eye{fill:var(--bg)}
.running .logo .body{fill:var(--accent)}
.running .logo{animation:hop .62s cubic-bezier(.3,.7,.4,1) infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}
  35%{transform:translateY(-5px) rotate(-6deg)}70%{transform:translateY(0) rotate(2deg)}}
.logo .dash{stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;opacity:0}
.running .logo .dash{animation:dash .62s linear infinite}
.running .logo .dash:nth-of-type(2){animation-delay:.14s}
.running .logo .dash:nth-of-type(3){animation-delay:.28s}
@keyframes dash{0%{opacity:0;transform:translateX(6px)}
  40%{opacity:.9}100%{opacity:0;transform:translateX(-14px)}}
h1{margin:0;font-size:1.34rem;font-weight:650;letter-spacing:-.025em}

/* ---------- centred column ---------- */
.mid{display:flex;flex-direction:column;align-items:center;margin-top:2.6rem}

/* ---------- provider chip ---------- */
.prov{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  font-size:.83rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:.36rem .5rem .36rem .95rem;color:var(--dim);flex-wrap:wrap;max-width:100%}
.prov b{color:var(--ink);font-weight:600}
.prov.unset{border-color:#3b3218;background:#17130a;color:var(--warn)}
.prov button{font:600 .74rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  padding:.34rem .68rem;border-radius:999px;background:#161d26;border:1px solid var(--line2);
  color:var(--dim);cursor:pointer;transition:color .15s,background .15s}
.prov button:hover{background:#1d2531;color:var(--ink)}
.prov select,.prov input{font:inherit;font-size:.82rem;background:var(--sunk);color:var(--ink);
  border:1px solid var(--line2);border-radius:9px;padding:.3rem .55rem}
.prov input{width:13rem;max-width:60vw}
.prov select:focus,.prov input:focus{outline:none;border-color:var(--accent)}
.hint{color:var(--faint);font-size:.79rem;margin:.75rem 0 0;max-width:58ch;line-height:1.6}
.hint b{color:var(--dim);font-weight:600}
.hint:empty{display:none}
.suggest:empty{display:none}
.suggest{margin-top:.8rem}
/* Neutral on purpose: this offers to reclassify what was seen, it is not a verdict. */
.suggest button{font:inherit;font-size:.82rem;font-weight:600;padding:.45rem .85rem;
  border-radius:10px;background:var(--surface);border:1px dashed var(--line2);
  color:var(--dim);cursor:pointer}
.suggest button:hover{background:#161d26;color:var(--ink)}

/* ---------- scope ---------- */
.scope{display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:3px;margin-top:1.5rem}
.scope button{font:600 .71rem/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;
  padding:.55rem .95rem;border:0;border-radius:999px;background:transparent;color:var(--faint);
  cursor:pointer;transition:color .15s,background .15s}
.scope button:hover{color:var(--dim)}
.scope button[aria-pressed="true"]{background:#1a222d;color:var(--ink)}
.scope button:disabled{cursor:default;opacity:.5}

/* ---------- the dial ---------- */
.go{position:relative;width:320px;height:320px;max-width:82vw;max-height:82vw;
  margin:1.1rem 0 .2rem;padding:0;border:0;background:none;cursor:pointer;
  border-radius:50%;color:inherit;display:block}
.go:disabled{cursor:default}
.go:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
.dial{width:100%;height:100%;display:block}
.dial .well{fill:url(#burrow)}
.dial .depth{fill:none;stroke:#131a23;stroke-width:1}
.dial .arc{fill:none;stroke:var(--arc);stroke-width:6;stroke-linecap:round;
  transition:stroke .45s,opacity .3s}
.dial .lab{font:600 9px/1 var(--mono);letter-spacing:.22em;fill:#4a5563;
  text-anchor:middle;dominant-baseline:middle;transition:fill .45s,opacity .3s}

.dial[data-vpn="run"]   .arc[data-k="vpn"],
.dial[data-dns="run"]   .arc[data-k="dns"],
.dial[data-speed="run"] .arc[data-k="speed"]{stroke:var(--accent);animation:breathe 1.15s ease-in-out infinite}
.dial[data-vpn="ok"]    .arc[data-k="vpn"],
.dial[data-dns="ok"]    .arc[data-k="dns"],
.dial[data-speed="ok"]  .arc[data-k="speed"]{stroke:var(--ok)}
.dial[data-vpn="bad"]   .arc[data-k="vpn"],
.dial[data-dns="bad"]   .arc[data-k="dns"],
.dial[data-speed="bad"] .arc[data-k="speed"]{stroke:var(--bad)}
.dial[data-vpn="unk"]   .arc[data-k="vpn"],
.dial[data-dns="unk"]   .arc[data-k="dns"],
.dial[data-speed="unk"] .arc[data-k="speed"]{stroke:var(--warn)}
.dial[data-vpn="run"]   .lab[data-k="vpn"],
.dial[data-dns="run"]   .lab[data-k="dns"],
.dial[data-speed="run"] .lab[data-k="speed"]{fill:var(--accent)}
.dial[data-vpn="ok"]    .lab[data-k="vpn"],
.dial[data-dns="ok"]    .lab[data-k="dns"],
.dial[data-speed="ok"]  .lab[data-k="speed"]{fill:#4b8b72}
.dial[data-vpn="bad"]   .lab[data-k="vpn"],
.dial[data-dns="bad"]   .lab[data-k="dns"],
.dial[data-speed="bad"] .lab[data-k="speed"]{fill:#9c5757}
.dial.off-vpn   .arc[data-k="vpn"],   .dial.off-vpn   .lab[data-k="vpn"],
.dial.off-dns   .arc[data-k="dns"],   .dial.off-dns   .lab[data-k="dns"],
.dial.off-speed .arc[data-k="speed"], .dial.off-speed .lab[data-k="speed"]{opacity:.3}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}

/* Idle invitation. Nothing on this page moves until you press the dial, so the
   dial has to say that it is the thing to press - a still, grey circle does not.
   The ping reads as a network probe going out, which is what the button does. */
.dial .ping{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:0;
  transform-origin:140px 140px}
.go.ready .dial .ping{animation:ping 3s cubic-bezier(.25,.6,.3,1) infinite}
.go.ready .dial .ping:nth-of-type(2){animation-delay:1.5s}
@keyframes ping{
  0%{transform:scale(.97);opacity:0}
  12%{opacity:.42}
  100%{transform:scale(1.22);opacity:0}}
/* Colour the invitation, never a verdict. Marked with an explicit class rather than
   :not(.ok):not(.bad) - :not() carries its argument's specificity, so that version
   outranked .word.ok and repainted the result. */
.go.ready .word.invite{color:var(--accent);text-shadow:0 0 22px rgba(79,216,196,.28)}
.go.ready:hover .word.invite{color:#eafffb;text-shadow:0 0 26px rgba(79,216,196,.5)}
.go.ready:hover .ring-hit{stroke:#2f4a52}

.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.5rem;pointer-events:none;text-align:center;padding:0 18%}
.word{font:600 3.4rem/1 var(--mono);letter-spacing:.13em;margin-right:-.13em;color:var(--ink)}
.word.sm{font-size:1.2rem;letter-spacing:.17em;margin-right:-.17em}
.word.ok{color:var(--ok)} .word.bad{color:var(--bad)} .word.warn{color:var(--warn)}
.note{font:500 .72rem/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.go:hover:not(:disabled) .ring-hit{stroke:#243040}
.ring-hit{fill:none;stroke:#1b2430;stroke-width:1;transition:stroke .2s}

/* ---------- results panel ---------- */
.panel{width:100%;margin-top:1.7rem;border:1px solid var(--line);border-radius:16px;
  background:var(--surface);display:flex;overflow:hidden}
.cell{flex:1 1 0;padding:1.15rem 1.2rem 1.3rem;border-left:1px solid var(--line);min-width:0}
.cell[hidden]{display:none}
/* One check selected: the panel narrows to a third so the cell keeps the width it
   has in the full row, instead of stretching a single result across the page. */
.panel.solo{width:33.4%;min-width:270px}
/* The leftmost visible cell, not the first in the DOM - cells hide with the scope. */
.cell.first{border-left:0}
.cell h2{margin:0 0 .85rem;font:600 .68rem/1 var(--mono);letter-spacing:.2em;
  text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:.55rem}
.led{width:6px;height:6px;border-radius:50%;background:#2b3340;flex:none;transition:background .3s}
.cell.run .led{background:var(--accent);animation:breathe 1s ease-in-out infinite}
.cell.ok  .led{background:var(--ok)}
.cell.bad .led{background:var(--bad)}
.cell.unk .led{background:var(--warn)}
.cell.run h2,.cell.ok h2,.cell.bad h2,.cell.unk h2{color:var(--dim)}
/* left out of the last run: still readable, but clearly not part of it */
.cell.stale{opacity:.42}
.metric{font:600 1.9rem/1.05 var(--mono);letter-spacing:-.035em;margin:0 0 .2rem;
  overflow-wrap:anywhere}
.metric small{font:500 .74rem/1 var(--mono);letter-spacing:.05em;color:var(--dim);margin-left:.45rem}
.meta{color:var(--dim);font-size:.82rem;line-height:1.5;overflow-wrap:anywhere}
.meta .k{color:var(--faint)}
.verdict{margin-top:.85rem;font-size:.84rem;font-weight:600;line-height:1.45}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.unk{color:var(--warn)}
.idle{color:var(--faint);font-size:.84rem}
.rowin{animation:rowin .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rowin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.gauge{height:3px;border-radius:3px;background:#171e27;margin:.4rem 0 .1rem;overflow:hidden}
.gauge i{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--accent2),var(--accent));
  transition:width .9s cubic-bezier(.2,.8,.2,1)}
.line{display:flex;gap:.6rem;font-size:.78rem;padding:.28rem 0;border-top:1px solid #151c25}
.line:first-child{border-top:0;padding-top:0}
.line .ip{font-family:var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1;min-width:0}
.line .as{color:var(--faint);white-space:nowrap;font-size:.74rem}
.line.bad .ip{color:var(--bad)}
/* Split-routing rows: the destination is the label and must not be the thing that
   collapses - "ipinfo.io" truncated to "ip…" tells you nothing about which path. */
.line.stack{flex-direction:column;gap:.15rem;align-items:flex-start}
.line.stack .ip{flex:none;white-space:normal;overflow:visible;text-overflow:clip}
.line.stack .as{white-space:normal}

/* ---------- raw output ---------- */
details{width:100%;margin-top:1rem;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
summary{cursor:pointer;padding:.7rem 1rem;color:var(--dim);font:600 .74rem/1 var(--mono);
  letter-spacing:.13em;text-transform:uppercase;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'+ ';color:var(--faint)}
details[open] summary::before{content:'− '}
pre{margin:0;padding:0 1rem 1rem;overflow-x:auto;white-space:pre;
  font:12.5px/1.6 var(--mono);color:#a9b3c0}
.foot{color:var(--bad);font-size:.8rem;margin-top:.9rem;text-align:center}
.foot:empty{display:none}

@media(max-width:720px){
  .panel{flex-direction:column}
  .panel.solo{width:100%}
  .cell{border-left:0;border-top:1px solid var(--line)}
  .cell.first{border-top:0}
  .scope{flex-wrap:wrap;justify-content:center;border-radius:14px}
  .scope button{flex:1 0 auto}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div class="wrap" id="wrap">
  <div class="head">
    <div class="logo">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <g class="body">
          <ellipse cx="26" cy="33" rx="13" ry="9.5"/>
          <circle cx="15" cy="26" r="7.2"/>
          <path d="M13 20.5c-1.6-4.6-1.2-8.9.6-9.5 1.8-.6 4 2.6 5 7.2z"/>
          <path d="M18.5 19.4c-.4-4.8.8-8.8 2.7-8.9 1.9-.1 3.2 3.6 3.2 8.4z"/>
          <circle cx="11.5" cy="25" r="1.5" class="eye"/>
          <path d="M38 30c2.6-1.2 4.6-.6 4.4.7-.2 1.3-2.3 2.2-4.6 1.9z"/>
        </g>
        <line class="dash" x1="6" y1="30" x2="0" y2="30"/>
        <line class="dash" x1="8" y1="35" x2="1" y2="35"/>
        <line class="dash" x1="7" y1="40" x2="2" y2="40"/>
      </svg>
    </div>
    <h1>Tunnel&nbsp;Bunny</h1>
  </div>
  <div class="mid">
    <div class="prov" id="prov"><span style="color:var(--faint)">reading configuration…</span></div>
    <div class="hint" id="hint"></div>
    <div class="suggest" id="suggest"></div>

    <div class="scope" id="scope" role="group" aria-label="What to measure">
      <button data-w="all" aria-pressed="true">Everything</button>
      <button data-w="vpn" aria-pressed="false">VPN</button>
      <button data-w="dns" aria-pressed="false">DNS</button>
      <button data-w="speed" aria-pressed="false">Speed</button>
    </div>

    <button class="go ready" id="go">
      <svg class="dial" id="dial" viewBox="0 0 280 280" aria-hidden="true">
        <defs>
          <radialGradient id="burrow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0e161d"/>
            <stop offset="65%" stop-color="#0a0d12"/>
            <stop offset="100%" stop-color="#080a0e"/>
          </radialGradient>
        </defs>
        <circle class="well" cx="140" cy="140" r="94"/>
        <circle class="depth" cx="140" cy="140" r="72"/>
        <circle class="ping" cx="140" cy="140" r="94"/>
        <circle class="ping" cx="140" cy="140" r="94"/>
        <circle class="ring-hit" cx="140" cy="140" r="94"/>
        <g transform="rotate(-210 140 140)">
          <circle class="arc" data-k="vpn"   cx="140" cy="140" r="110"
                  stroke-dasharray="198.4 492.8" stroke-dashoffset="0"/>
          <circle class="arc" data-k="dns"   cx="140" cy="140" r="110"
                  stroke-dasharray="198.4 492.8" stroke-dashoffset="-230.4"/>
          <circle class="arc" data-k="speed" cx="140" cy="140" r="110"
                  stroke-dasharray="198.4 492.8" stroke-dashoffset="-460.8"/>
        </g>
        <text class="lab" data-k="vpn"   x="31"  y="77">VPN</text>
        <text class="lab" data-k="dns"   x="249" y="77">DNS</text>
        <text class="lab" data-k="speed" x="140" y="266">SPEED</text>
      </svg>
      <span class="face" id="face">
        <span class="word invite">GO</span>
        <span class="note">start the check</span>
      </span>
    </button>

    <div class="panel" id="panel">
      <div class="cell" id="c-vpn">
        <h2><span class="led"></span>VPN</h2>
        <div class="content"><div class="idle">Not measured.</div></div>
      </div>
      <div class="cell" id="c-dns">
        <h2><span class="led"></span>DNS leak</h2>
        <div class="content"><div class="idle">Not measured.</div></div>
      </div>
      <div class="cell" id="c-speed">
        <h2><span class="led"></span>Speed</h2>
        <div class="content"><div class="idle">Not measured.</div></div>
      </div>
    </div>

    <details id="rawbox" hidden>
      <summary>Raw output from check</summary>
      <pre id="raw"></pre>
    </details>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const wrap = $('wrap'), prov = $('prov'), hint = $('hint'), suggest = $('suggest'),
      raw = $('raw'), rawbox = $('rawbox'), foot = $('foot'),
      dial = $('dial'), face = $('face'), go = $('go');
const scopeBtns = [...$('scope').querySelectorAll('button')];
const CHECKS = ['vpn','dns','speed'];
const card = k => $('c-' + k);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// Several providers have more than one org name in the ASN registry, hence the
// alternations. Mullvad AS39351 is "31173 Services AB"; NordVPN is both Tefincom
// and PacketHub. A single brand name would report a false leak.
// Only providers verified against the ASN registry are listed. A guessed pattern
// reports a leak that is not there, which is the worst answer this tool can give -
// so the list stays short and anything else goes through "Other", or through the
// button that offers the name actually seen after a run.
const PROVIDERS = [
  ['OVPN',       'Obehosting|OVPN'],
  ['Mullvad',    '31173 Services|Mullvad'],
  ['Proton VPN', 'Proton'],
  ['NordVPN',    'Tefincom|PacketHub|NordVPN'],
  ['Surfshark',  'Surfshark'],
];

/* ---------- provider ---------- */
let current = '';
function showProvider(p){
  current = p;
  const known = PROVIDERS.find(x => x[1] === p);
  prov.className = p ? 'prov' : 'prov unset';
  prov.innerHTML = p
    ? `VPN provider: <b>${esc(known ? known[0] : p)}</b> <button id="edit">change</button>`
    : `No VPN provider set — no verdict given <button id="edit">set</button>`;
  hint.textContent = '';
  $('edit').onclick = editProvider;
}
function editProvider(){
  prov.className = 'prov';
  const known = PROVIDERS.find(x => x[1] === current);
  const opts = PROVIDERS.map(([n,v]) =>
    `<option value="${esc(v)}"${v===current?' selected':''}>${esc(n)}</option>`).join('');
  prov.innerHTML =
    `<select id="sel"><option value="">— choose provider —</option>${opts}` +
    `<option value="__custom"${current && !known ? ' selected':''}>Other (custom pattern)…</option></select>` +
    `<input id="inp" maxlength="64" placeholder="e.g. Obehosting|OVPN" value="${esc(current)}" ` +
    `style="display:${current && !known ? 'inline-block':'none'}">` +
    `<button id="save">Save</button><button id="cancel">Cancel</button>`;
  const sel = $('sel'), inp = $('inp');
  hint.innerHTML = 'Matched against the ASN/org field on the <b>belongs to</b> line. Several providers '
    + 'have more than one company name — Mullvad’s network is <b>31173 Services AB</b>, '
    + 'NordVPN appears as both <b>Tefincom</b> and <b>PacketHub</b> — so these are patterns, '
    + 'not names. Only providers verified against the registry are listed — for anything '
    + 'else, run the check once and use the button that offers the name it actually saw.';
  sel.onchange = () => {
    if (sel.value === '__custom'){ inp.style.display='inline-block'; inp.focus(); }
    else { inp.style.display='none'; inp.value = sel.value; }
  };
  $('cancel').onclick = () => showProvider(current);
  $('save').onclick = () => save();
  inp.onkeydown = e => { if (e.key==='Enter') save(); if (e.key==='Escape') showProvider(current); };
}
async function save(v){
  if (typeof v !== 'string'){
    const sel = $('sel'), inp = $('inp');
    v = (sel && sel.value && sel.value !== '__custom') ? sel.value : (inp ? inp.value : '');
  }
  v = v.trim();
  prov.innerHTML = '<span style="color:var(--faint)">saving…</span>';
  try{
    const b = btoa(unescape(encodeURIComponent(v)));   // base64: no URL decoding needed in the shell
    const t = (await (await fetch('/cgi-bin/run?what=setprov&v='+encodeURIComponent(b),
                                  {cache:'no-store'})).text()).trim();
    if (t === 'invalid characters' || t === 'could not save'){
      showProvider(current); hint.textContent = 'Could not save: ' + t + '.';
    } else showProvider(t);
  }catch(e){ showProvider(current); hint.textContent = 'Error: ' + e.message; }
}

/* ---------- dial ---------- */
// The three arcs are the status display: one per check, in the order they run.
const state = {vpn:'', dns:'', speed:''};
function setState(k, s){ state[k] = s; dial.dataset[k] = s; }
function setFace(word, note, cls){
  // No verdict class means this is an invitation to press, not a result - it gets
  // the accent colour; a result keeps its own green/red/amber.
  face.innerHTML = `<span class="word ${cls || 'invite'}${word.length>2?' sm':''}">${esc(word)}</span>`
                 + `<span class="note">${esc(note)}</span>`;
}

/* ---------- cell rendering ---------- */
function setCard(k, cls, html){
  const c = card(k);
  // 'first' is layout, not state - it must survive a re-render.
  c.className = 'cell' + (c.classList.contains('first') ? ' first' : '') + (cls ? ' ' + cls : '');
  c.querySelector('.content').innerHTML = html;
}
const vLine = (cls, txt) => `<div class="verdict ${cls} rowin">${esc(txt)}</div>`;

function renderVpn(t){
  const ip  = (t.match(/^\s*exit IP\s+(.+)$/m)||[])[1] || '';
  const org = (t.match(/^\s*belongs to\s+(.+)$/m)||[])[1] || '';
  const split = /SPLIT ROUTING/.test(t);
  const ok  = /^\s*OK /m.test(t), bad = !split && /^\s*!! /m.test(t);

  // Split routing has no single answer, so show both paths rather than a verdict.
  if (split){
    splitSeen = true;
    const paths = [...t.matchAll(/^\s+(\S+?)\s*->\s*(\S+)\s+(.*)$/gm)];
    setCard('vpn','bad', `
      <div class="metric rowin" style="font-size:1.1rem">Split routing</div>
      <div style="margin-top:.6rem">${paths.map((m,i)=>
        `<div class="line stack rowin" style="animation-delay:${i*60}ms">
           <span class="ip">${esc(m[1])}</span>
           <span class="as">${esc(m[2])} · ${esc(m[3])}</span></div>`).join('')}</div>
      ${vLine('bad','Only some traffic is tunnelled — no single verdict fits.')}`);
    setState('vpn','bad');
    return;
  }

  setCard('vpn', ok?'ok':bad?'bad':'unk', `
    <div class="metric rowin" style="font-size:${(ip||'').length>15?'1.25rem':'1.6rem'}">${esc(ip||'—')}</div>
    <div class="meta rowin"><span class="k">belongs to</span> ${esc(org||'unknown')}</div>
    ${ok  ? vLine('ok','Exit belongs to your VPN provider.') : ''}
    ${bad ? vLine('bad','Exit does NOT belong to your VPN provider.') : ''}
    ${!ok&&!bad ? vLine('unk','No provider set — no verdict given.') : ''}`);
  setState('vpn', ok?'ok':bad?'bad':'unk');
}

function renderDns(t){
  const rows = [...t.matchAll(/^\s*(!!|)\s*((?:\d{1,3}\.){3}\d{1,3}|[0-9a-f:]{6,})\s{2,}(.+?)\s*$/gmi)];
  const split = /SPLIT ROUTING/.test(t);
  const ok = !split && /^\s*OK /m.test(t), bad = /^\s*!! \d+ of/m.test(t);
  if (split) splitSeen = true;
  const n  = rows.length;
  const list = rows.map((m,i)=>
    `<div class="line ${m[1]?'bad':''} rowin" style="animation-delay:${i*45}ms">
       <span class="ip">${esc(m[2])}</span><span class="as">${esc(m[3])}</span></div>`).join('');
  setCard('dns', ok?'ok':(bad||split)?'bad':'unk', `
    <div class="metric rowin">${n}<small>resolver${n===1?'':'s'}</small></div>
    <div style="margin-top:.5rem">${list || '<div class="idle">none seen</div>'}</div>
    ${ok  ? vLine('ok','All belong to your VPN provider.') : ''}
    ${bad ? vLine('bad',(t.match(/!! (\d+ of \d+[^\n]*)/)||[,'DNS is leaking'])[1]) : ''}
    ${split ? vLine('bad','Split routing — this covers bash.ws only, not the network.') : ''}
    ${!ok&&!bad&&!split ? vLine('unk','No provider set — no verdict given.') : ''}`);
  setState('dns', (bad||split)?'bad':ok?'ok':'unk');
}

function renderSpeed(t){
  const g = re => { const m = t.match(re); return m ? parseFloat(m[1]) : null; };
  const dn = g(/Download:\s*~?([\d.]+)\s*Mbps/i);
  const up = g(/Upload:\s*~?([\d.]+)\s*Mbps/i);
  const ls = g(/Packet Loss:\s*([\d.]+)/i);
  // Nothing pins the measuring server, so it can differ between two runs. Naming it
  // is the difference between "the VPN halved my speed" and "a different server did".
  const srv = ((t.match(/^\s*Server:\s*(.+?)\s*$/m)||[])[1] || '').replace(/\s*\(id:\s*\d+\)$/,'');
  if (dn === null && up === null){
    setCard('speed','bad',
      `<div class="idle">${esc(t.replace(/^== .* ==\s*/,'').trim()||'measurement failed')}</div>`);
    setState('speed','bad');
    return;
  }
  const peak = Math.max(dn||0, up||0, 1);
  setCard('speed','ok', `
    <div class="metric rowin"><span id="n-dn">0</span><small>Mbps down</small></div>
    <div class="gauge"><i id="g-dn"></i></div>
    <div class="metric rowin" style="margin-top:.75rem"><span id="n-up">0</span><small>Mbps up</small></div>
    <div class="gauge"><i id="g-up"></i></div>
    ${ls !== null ? `<div class="meta rowin" style="margin-top:.75rem">
        <span class="k">packet loss</span> ${ls}%</div>` : ''}
    ${srv ? `<div class="meta rowin"${ls === null ? ' style="margin-top:.75rem"' : ''}>
        <span class="k">measured against</span> ${esc(srv)}</div>` : ''}`);
  setState('speed','ok');
  countTo($('n-dn'), dn||0); countTo($('n-up'), up||0);
  requestAnimationFrame(()=>{
    $('g-dn').style.width = ((dn||0)/peak*100)+'%';
    $('g-up').style.width = ((up||0)/peak*100)+'%';
  });
}

// Counts the number up - makes the measurement feel like it lands.
function countTo(el, target){
  const dur = 900, t0 = performance.now();
  (function step(now){
    const p = Math.min(1, (now-t0)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = (target*e).toFixed(target<100?1:0);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

/* ---------- running ---------- */
function offerDetected(text){
  suggest.innerHTML = '';
  const m = text.match(/^\s*belongs to\s+(.+)$/m);
  if (!m) return;
  const org = m[1].trim().replace(/^AS\d+\s+/,'');
  if (!org || org === 'unknown') return;
  let already = false;
  try { already = current && new RegExp(current,'i').test(m[1]); } catch {}
  if (already) return;
  const b = document.createElement('button');
  b.textContent = `Use “${org}” as VPN provider`;
  b.onclick = () => { suggest.innerHTML=''; save(org); };
  suggest.appendChild(b);
}

const RENDER = {vpn:renderVpn, dns:renderDns, speed:renderSpeed};
const TITLE  = {vpn:'VPN', dns:'DNS', speed:'SPEED'};
let busy = false, rawAll = '', scope = 'all', splitSeen = false;

// The scope decides what is on screen: only the checks it covers get an arc and
// a cell. Picking DNS should not leave two cells standing there with nothing to
// do - or worse, holding a result this run never touched.
function setScope(s){
  if (busy) return;
  scope = s;
  const on = k => s === 'all' || s === k;
  scopeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.w === s)));
  $('panel').classList.toggle('solo', s !== 'all');
  CHECKS.forEach(k => {
    dial.classList.toggle('off-' + k, !on(k));
    card(k).hidden = !on(k);
    card(k).classList.toggle('first', k === CHECKS.find(on));
  });
}

// Only the tunnel checks carry a verdict. A speed-only run says so instead of
// borrowing a word it has not measured.
function summarise(list){
  const seen = list.filter(k => k !== 'speed').map(k => state[k]);
  // Split routing before leak: some traffic IS tunnelled, so "leak" overstates it -
  // and the cells say "no single verdict fits" while the dial would have said LEAK.
  if (splitSeen) return ['SPLIT','bad'];
  if (seen.includes('bad')) return ['LEAK','bad'];
  if (seen.includes('ok'))  return ['TUNNELLED','ok'];
  if (seen.includes('unk')) return ['NO VERDICT','warn'];
  return ['MEASURED',''];
}

async function one(k){
  setCard(k, 'run', '<div class="idle">measuring…</div>');
  setState(k, 'run');
  const r = await fetch('/cgi-bin/run?what='+k, {cache:'no-store'});
  const t = (await r.text()).replace(/\s+$/,'');
  rawAll += (rawAll ? '\n\n' : '') + t;
  raw.textContent = rawAll; rawbox.hidden = false;
  try { RENDER[k](t); } catch(e){ setCard(k,'', `<pre style="padding:0">${esc(t)}</pre>`); setState(k,''); }
  if (k === 'vpn') offerDetected(t);
}

async function run(){
  if (busy) return;
  busy = true; rawAll = ''; splitSeen = false; foot.textContent = '';
  go.disabled = true;
  go.classList.remove('ready');          // the arcs carry the motion while it runs
  scopeBtns.forEach(b => b.disabled = true);
  wrap.classList.add('running');
  const list = (scope === 'all') ? CHECKS.slice() : [scope];
  CHECKS.forEach(k => setState(k, ''));
  // A scoped run leaves the other cells showing an older result - dim them so the
  // panel never passes off a previous measurement as part of this one.
  CHECKS.forEach(k => card(k).classList.toggle('stale', !list.includes(k)));
  list.forEach(k => setCard(k, '', '<div class="idle">queued…</div>'));
  const t0 = Date.now();
  const el = () => ((Date.now()-t0)/1000).toFixed(0) + ' s elapsed';
  let step = list[0];
  setFace('GO', el());
  const tick = setInterval(() => {
    const n = face.querySelector('.note');
    if (n) n.textContent = el();
  }, 250);
  try {
    for (const k of list){
      step = k;
      setFace(TITLE[k], el());
      await one(k);                                  // one at a time: the cells fill in sequence
    }
    clearInterval(tick);
    const [word, cls] = summarise(list);
    setFace(word, 'done in ' + ((Date.now()-t0)/1000).toFixed(1) + ' s', cls);
  } catch(e){
    clearInterval(tick);
    setFace('FAILED', 'tap to try again', 'bad');
    setState(step, 'bad');
    foot.textContent = TITLE[step] + ' check failed: ' + e.message;
  }
  wrap.classList.remove('running');
  go.disabled = false;
  go.classList.add('ready');
  scopeBtns.forEach(b => b.disabled = false);
  busy = false;
}

scopeBtns.forEach(b => b.addEventListener('click', () => setScope(b.dataset.w)));
go.addEventListener('click', run);
setScope('all');
(async () => {
  try { showProvider((await (await fetch('/cgi-bin/run?what=info',{cache:'no-store'})).text()).trim()); }
  catch { prov.innerHTML = '<span style="color:var(--faint)">could not read configuration</span>'; }
})();
</script>
</html>
